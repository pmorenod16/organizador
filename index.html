<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#3B5BDB">
<title>Organizador</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main id="carga" class="pantalla centro">
  <img src="icons/icon.svg" alt="" width="72" height="72">
  <p id="cargaTexto">Cargando…</p>
  <p id="cargaError" class="error"></p>
</main>

<main id="login" class="pantalla centro" hidden>
  <img src="icons/icon.svg" alt="" width="72" height="72">
  <h1>Organizador</h1>
  <p class="suave">Qué toca ahora y cómo empezarlo.</p>
  <button id="btnGoogle" class="btn primario">Entrar con Google</button>
  <p id="loginError" class="error"></p>
</main>

<main id="sinAcceso" class="pantalla centro" hidden>
  <h1>Falta un paso</h1>
  <p id="sinAccesoTexto"></p>
  <p class="uid"><code id="uidTexto"></code> <button id="btnCopiarUid" class="btn">Copiar</button></p>
  <button id="btnSalir" class="btn">Salir</button>
</main>

<div id="app" hidden>
  <header class="cabecera">
    <nav class="pestanas" role="tablist">
      <button role="tab" data-vista="hoy" aria-selected="true">Hoy</button>
      <button role="tab" data-vista="manana" aria-selected="false">Mañana</button>
    </nav>
    <button id="btnAjustes" class="icono" aria-label="Ajustes">⚙️</button>
  </header>
  <section id="vista"></section>
  <form id="entrada" class="entrada" autocomplete="off">
    <button type="button" id="btnVoz" class="icono" aria-label="Dictar">🎤</button>
    <input id="entradaTexto" placeholder="Dime qué tienes que hacer o qué ha cambiado…" enterkeyhint="send">
    <button type="submit" class="icono" aria-label="Enviar">➤</button>
  </form>
</div>

<div id="modal" class="modal" hidden><div class="tarjeta" id="modalContenido"></div></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="src/main.js?v=202611150744"></script>
</body>
</html>
