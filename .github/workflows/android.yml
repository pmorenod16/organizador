name: App Android

# Construye el APK y lo publica en «Releases» con el nombre organizador.apk.
# Enlace de descarga permanente:
#   https://github.com/pmorenod16/organizador/releases/latest/download/organizador.apk
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["app/**", "scripts/android-setup.mjs", ".github/workflows/android.yml"]

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Instalar dependencias
        run: |
          (cd scripts && npm install --no-audit --no-fund)
          (cd app && npm install --no-audit --no-fund)

      - name: Crear proyecto Android
        working-directory: app
        run: npx cap add android

      - name: Registrar la app en Firebase y preparar la firma
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/android-setup.mjs "$RUNNER_TEMP/organizador.jks" app/android/app/google-services.json

      - name: Configurar compilación (Google, firma, alarma, permisos, iconos)
        working-directory: app
        run: |
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "organizador"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          # plugin de la alarma
          DEST=android/app/src/main/java/io/github/pmorenod16/organizador
          cp android-extra/AlarmaPlugin.java android-extra/MainActivity.java "$DEST/"
          # permisos: alarma, avisos a su hora exacta, micrófono y reconocimiento de voz
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="com.android.alarm.permission.SET_ALARM" />\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <queries><intent><action android:name="android.speech.RecognitionService" /></intent></queries>\n    <application#' $M
          grep -q SET_ALARM $M
          # la app abre la web con ?apk=N para saber qué versión del APK está instalada
          sed -i 's#"url": "https://pmorenod16.github.io/organizador/"#"url": "https://pmorenod16.github.io/organizador/?apk=${{ github.run_number }}"#' capacitor.config.json
          grep -q '?apk=' capacitor.config.json
          npx @capacitor/assets generate --android --iconBackgroundColor '#3B5BDB' --splashBackgroundColor '#F4F5F8'
          npx cap sync android

      - name: Compilar APK
        working-directory: app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/android/app/build/outputs/apk/release/app-release.apk organizador.apk
          TAG="v1.${{ github.run_number }}"
          gh release create "$TAG" organizador.apk --title "Organizador $TAG" \
            --notes "Descarga **organizador.apk** en el móvil y ábrelo para instalar o actualizar la app." --latest
