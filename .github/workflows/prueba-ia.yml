name: Prueba IA
on:
  push:
    branches: [main]
    paths: ["scripts/prueba-ia.mjs", ".github/workflows/prueba-ia.yml"]
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/prueba-ia.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
