name: App Android de Tasca

# Construye el APK de Tasca y lo deja siempre en la misma dirección:
#   https://github.com/pmorenod16/organizador/releases/download/tasca/tasca.apk
# (en las «pull requests» solo compila, para comprobar que funciona)
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["tareas/app/**", "scripts/android-setup.mjs", ".github/workflows/android-tasca.yml"]
  pull_request:
    paths: ["tareas/app/**", "scripts/android-setup.mjs", ".github/workflows/android-tasca.yml"]

permissions:
  contents: write

concurrency:
  group: android-tasca-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ANDROID_PACKAGE: io.github.pmorenod16.tasca
      ANDROID_NOMBRE: Tasca
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }

      - name: Instalar dependencias
        run: |
          (cd scripts && npm install --no-audit --no-fund)
          (cd tareas/app && npm install --no-audit --no-fund)

      - name: Crear proyecto Android
        working-directory: tareas/app
        run: npx cap add android

      - name: Registrar la app en Firebase y preparar la firma
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/android-setup.mjs "$RUNNER_TEMP/tasca.jks" tareas/app/android/app/google-services.json

      - name: Configurar compilación (Google, firma, permisos, iconos)
        working-directory: tareas/app
        run: |
          sed -i 's/^ext {/ext {\n    rgcfaIncludeGoogle = true/' android/variables.gradle
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  release {
                      storeFile file(System.getenv("KS_FILE"))
                      storePassword System.getenv("KS_PASS")
                      keyAlias "organizador"
                      keyPassword System.getenv("KS_PASS")
                  }
              }
              buildTypes { release { signingConfig signingConfigs.release } }
          }
          GRADLE
          sed -i "s/versionCode 1$/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          # plugin propio: notificación con el reloj del Enfoque (cronómetro de Android)
          DEST=android/app/src/main/java/io/github/pmorenod16/tasca
          cp android-extra/*.java "$DEST/"
          for d in android-extra/res/*/; do n=$(basename $d); mkdir -p android/app/src/main/res/$n && cp $d*.xml android/app/src/main/res/$n/; done
          grep -q "androidx.core" android/app/build.gradle || echo 'dependencies { implementation "androidx.core:core:1.12.0" }' >> android/app/build.gradle
          # avisos a su hora exacta y permiso de notificaciones
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32" />\n    <uses-permission android:name="android.permission.USE_EXACT_ALARM" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <application#' $M
          grep -q USE_EXACT_ALARM $M
          # bloqueo de distracciones (sin accesibilidad, para que Play Protect no frene la instalación):
          # «Acceso al uso» para saber qué app está delante y «Mostrar sobre otras apps» para taparla
          sed -i 's#<application#<uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions" />\n    <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />\n    <queries><intent><action android:name="android.intent.action.MAIN" /><category android:name="android.intent.category.LAUNCHER" /></intent></queries>\n    <application#' $M
          grep -q 'xmlns:tools' $M || sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' $M
          sed -i 's#</application>#    <service android:name=".BloqueoServicio" android:exported="false" android:foregroundServiceType="specialUse"><property android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE" android:value="Tapar apps que distraen durante una sesion de estudio" /></service>\n        <activity android:name=".BloqueoActivity" android:exported="false" android:excludeFromRecents="true" android:launchMode="singleTask" android:taskAffinity="io.github.pmorenod16.tasca.bloqueo" android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar" />\n    </application>#' $M
          grep -q BloqueoServicio $M
          # la app abre la web con ?apk=N para saber qué versión del APK está instalada
          sed -i 's#"url": "https://pmorenod16.github.io/organizador/tareas/"#"url": "https://pmorenod16.github.io/organizador/tareas/?apk=${{ github.run_number }}"#' capacitor.config.json
          grep -q '?apk=' capacitor.config.json
          npx @capacitor/assets generate --android --iconBackgroundColor '#D2541B' --splashBackgroundColor '#F7F5F2' --splashBackgroundColorDark '#17181C'
          npx cap sync android

      - name: Compilar APK
        working-directory: tareas/app/android
        run: ./gradlew assembleRelease --no-daemon

      - name: Publicar en Releases (tasca.apk)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tareas/app/android/app/build/outputs/apk/release/app-release.apk tasca.apk
          N="${{ github.run_number }}"
          if gh release view tasca >/dev/null 2>&1; then
            gh release upload tasca tasca.apk --clobber
            gh release edit tasca --title "Tasca 1.$N" --latest=false
          else
            gh release create tasca tasca.apk --title "Tasca 1.$N" --latest=false \
              --notes "Descarga **tasca.apk** en el móvil y ábrelo para instalar o actualizar Tasca."
          fi

      - name: Guardar el APK de prueba
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: tasca-apk
          path: tareas/app/android/app/build/outputs/apk/release/app-release.apk
