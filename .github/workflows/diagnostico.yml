name: Diagnóstico IA
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["scripts/diagnostico.mjs", ".github/workflows/diagnostico.yml"]
jobs:
  probar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/diagnostico.mjs
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
